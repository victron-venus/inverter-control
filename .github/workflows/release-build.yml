name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      release_plan_artifact:
        description: Frozen version plan artifact allocated by the release workflow
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - name: Download frozen release version plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen release version inputs
        shell: bash
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build exact candidate assets
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: bash scripts/package-release.sh "$VERSION" "$CHANNEL"
      - name: Build and verify the optional ARMv7 TLS dependency payload
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx build --platform linux/arm/v7 \
            --file build-support/tls-armv7/Dockerfile \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --output type=local,dest=release-dist/tls-armv7 --progress plain .
          python3 scripts/package_tls_bundle.py "$VERSION"
      - name: Verify all artifact checksums
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS
      - name: Verify and stage versioned release assets
        shell: bash
        env:
          RELEASE_ASSET_TARGET: package
          RELEASE_ASSET_PATTERN_0: release-dist/*.tar.gz
          RELEASE_ASSET_PATTERN_1: release-dist/SHA256SUMS
        run: python3 scripts/stage_release_assets.py --target "$RELEASE_ASSET_TARGET" --pattern "$RELEASE_ASSET_PATTERN_0" --pattern "$RELEASE_ASSET_PATTERN_1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-assets
          path: release-assets/package/*
          if-no-files-found: error
          retention-days: 14
  sign:
    name: Sign and verify release payloads
    needs: package
    if: ${{ github.repository == 'victron-venus/inverter-control' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-assets
          path: signed-release-assets
      - name: Check complete build inventory before signing
        run: python3 scripts/release_signatures.py verify-build signed-release-assets
      - name: Sign with the short-lived GitHub workflow identity
        run: >-
          cosign sign-blob --yes
          --bundle signed-release-assets/SHA256SUMS.sigstore.json
          signed-release-assets/SHA256SUMS
      - name: Verify identity, source commit and payload bytes
        run: python3 scripts/release_signatures.py verify signed-release-assets --source-sha "$GITHUB_SHA"
      - name: Confirm a wrong source identity is rejected
        run: |
          if python3 scripts/release_signatures.py verify signed-release-assets --source-sha 0000000000000000000000000000000000000000; then
            echo "Signature verification accepted the wrong source commit" >&2
            exit 1
          fi
      - name: Bind the signature bundle to the frozen version plan
        run: |
          python3 scripts/stage_release_assets.py --target signature --pattern signed-release-assets/SHA256SUMS.sigstore.json
          cp release-assets/signature/release-inputs-signature.json signed-release-assets/
      - name: Check all package and signature receipts
        run: python3 scripts/release_signatures.py verify-build signed-release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: signed-release-assets/*
          if-no-files-found: error
          retention-days: 14
