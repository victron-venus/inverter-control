name: Manual native memory check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tls-native-sanitizer:
    name: CFFI native memory safety fuzz check
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build with ASan, calibrate detection, and fuzz native CFFI APIs
        run: |
          docker buildx build --platform linux/amd64 \
            --file build-support/tls-armv7/Dockerfile --target sanitizer-export \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --output type=local,dest=release-dist/sanitizer --progress plain .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cffi-address-sanitizer
          path: release-dist/sanitizer/sanitizer-result.json
          if-no-files-found: error
