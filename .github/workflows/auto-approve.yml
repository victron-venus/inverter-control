name: 'Auto Approve PRs'
# Auto-approve Dependabot and Renovate PRs
# (workflow-level `description:` is not a valid GitHub Actions key — it breaks
# OSSF Scorecard's workflow verification when results are uploaded)

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@f27c012d5ab60f728d131a69d24819bba0b8963a
    # BOT_PAT must be forwarded explicitly (reusable workflows receive no
    # secrets by default). Without the secret the step skips cleanly.
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
