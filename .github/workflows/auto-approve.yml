name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@3c602f73d2356f36bbb0639dc1d00f9ffb10290d
    with:
      pr-author: 'dependabot[bot],renovate[bot],4alvit'
      required-reviews: '0'
      pr-types: 'all'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
