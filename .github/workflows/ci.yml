name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
    with:
      python-version: '3.11'
      run-type-check: false
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-secrets-template:
    name: Validate Secrets Template
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate local_config.example.py syntax
        run: python -m py_compile local_config.example.py

      - name: Check local_config.example.py has no real values
        run: |
          if grep -E '(token|password|secret|key)\s*=\s*["\x27][^"\x27]{8,}' local_config.example.py | grep -v 'your_'; then
            echo "ERROR: local_config.example.py may contain real values"
            exit 1
          fi
          echo "OK: local_config.example.py looks like a template"
