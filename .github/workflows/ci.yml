name: CI
permissions:
  contents: read
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - run: bash scripts/ci.sh
  integration:
    name: Pinned mock contract integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - run: bash scripts/ci.sh integration
  validate-secrets-template:
    name: Validate Secrets Template
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Validate local_config.example.py syntax
      run: python -m py_compile local_config.example.py
    - name: Check local_config.example.py has no real values
      run: "if grep -E '(token|password|secret|key)\\s*=\\s*[\"\\x27][^\"\\x27]{8,}' local_config.example.py | grep\
        \ -v 'your_'; then\n  echo \"ERROR: local_config.example.py may contain real values\"\n  exit 1\nfi\necho\
        \ \"OK: local_config.example.py looks like a template\"\n"
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - '**'
  workflow_call: {}
