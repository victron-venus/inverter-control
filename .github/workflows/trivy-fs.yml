name: Trivy Filesystem Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release security gate separately blocks HIGH/CRITICAL findings.
      # Publish all severities here, preserving this scanner's existing identity.
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          skip-dirs: .git,.venv,.venv-ci,release-dist,dist,build
      - name: Publish complete Trivy results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
