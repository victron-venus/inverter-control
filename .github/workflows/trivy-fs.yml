name: Trivy Filesystem Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy FS Scan
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release security gate separately blocks HIGH/CRITICAL findings.
      # Publish all severities here, preserving this scanner's existing identity.
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          skip-dirs: .git,.venv,.venv-ci,release-dist,dist,build
      - name: Publish complete Trivy results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
