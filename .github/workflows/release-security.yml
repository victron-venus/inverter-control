# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Release security
'on':
  workflow_call: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - run: bash scripts/ci.sh bandit
    - name: Block high and critical dependencies, secrets and misconfiguration
      uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret,misconfig
        severity: HIGH,CRITICAL
        exit-code: '1'
        skip-dirs: .git,.venv,.venv-ci,release-dist,dist,build
