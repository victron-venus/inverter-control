name: Publish Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0  # Needed for changelog generation

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create PackageManager archive
      run: |
        PKG_NAME="inverter-control"
        VERSION="${{ steps.version.outputs.VERSION }}"
        ARCHIVE="${PKG_NAME}-${VERSION}.tar.gz"
        ARCHIVE_DIR="${PKG_NAME}"

        # Create package directory
        rm -rf "$ARCHIVE_DIR"
        mkdir -p "$ARCHIVE_DIR"

        # Copy files needed for PackageManager installation
        cp main.py "$ARCHIVE_DIR/"
        cp -r inverter_control "$ARCHIVE_DIR/"
        cp version gitHubInfo setup "$ARCHIVE_DIR/" 2>/dev/null || true

        # Create tarball
        tar -czf "$ARCHIVE" "$ARCHIVE_DIR/"

        echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_OUTPUT
        rm -rf "$ARCHIVE_DIR"

    - name: Update CHANGELOG.md
      if: env.CHANGELOG == 'true'
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        TEMP_FILE=$(mktemp)

        # Get the tag date
        TAG_DATE=$(git log -1 --format=%ci --date=short -- "${GITHUB_REF#refs/tags/}")

        # Create changelog entry header from release notes
        {
          echo "## [$VERSION] - $TAG_DATE"
          echo ""
          cat release.txt
          echo ""
        } > "$TEMP_FILE"

        # Prepend to CHANGELOG.md if it exists
        if [ -f CHANGELOG.md ]; then
          # Skip existing header if already present
          tail -n +6 CHANGELOG.md >> "$TEMP_FILE" 2>/dev/null || true
        else
          # Create new CHANGELOG.md from scratch
          {
            echo "# Changelog"
            echo ""
            echo "All notable changes to this project will be documented in this file."
            echo ""
            echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),"
            echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
            echo ""
          } > "$TEMP_FILE"
          tail -n +1 CHANGELOG.md >> "$TEMP_FILE" 2>/dev/null || true
        fi

        mv "$TEMP_FILE" CHANGELOG.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        body_path: release.txt
        draft: false
        prerelease: false
        files: |
          ${{ steps.archive.outputs.ARCHIVE }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit updated CHANGELOG.md
      if: env.CHANGELOG == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add CHANGELOG.md
        # Only commit if there are changes (file existed and was updated)
        git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${{ steps.version.outputs.VERSION }}"
        git push