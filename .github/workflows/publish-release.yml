name: Publish Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Report release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const tag = context.ref.replace('refs/tags/', '');
          console.log('Release published: ' + tag);

          const branch = 'release/${tag}';
          const path = `.releases/${tag}.md`;
          const content = Buffer.from(`Release ${tag} published at ${new Date().toISOString()}`).toString('base64');

          // Create a release branch (branch protection doesn't block branch creation)
          const baseSha = (await github.rest.repos.getBranch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            branch: 'main'
          })).data.commit.sha;

          await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/heads/${branch}`,
            sha: baseSha
          });

          // Create file on the release branch
          await github.rest.repos.createOrUpdateFileContents({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: path,
            branch: branch,
            message: `chore: release ${tag}`,
            content: content
          });

          // Create PR to merge into main
          const pr = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `chore: release ${tag}`,
            head: branch,
            base: 'main',
            body: `Automated release marker for ${tag}`
          });

          console.log('PR created: ' + pr.data.html_url);

          // Enable auto-merge so it merges without manual approval
          try {
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.data.number,
              merge_method: 'squash'
            });
          } catch (e) {
            console.log('Auto-merge failed (may need approval): ' + e.message);
          }

          // Clean up release branch
          try {
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
          } catch (e) {
            console.log('Branch cleanup skipped: ' + e.message);
          }
