name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add auto-merge label
        run: gh pr edit ${{ github.event.number }} --add-label auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
