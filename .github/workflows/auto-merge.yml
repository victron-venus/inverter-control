# Read trusted base metadata only; do not check out or execute PR code.
name: Auto Merge PRs
'on':
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge:
    if: contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@bb8fe19c2553f35e530a0a466bc3ff73a5c3aac6
    with:
      native-auto-merge: true
      required-status-checks: CodeQL,SonarCloud Code Analysis
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
