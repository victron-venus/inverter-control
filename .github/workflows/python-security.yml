name: Python Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 2'  # Weekly on Tuesdays

permissions:
  contents: read

jobs:
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        pip install --only-binary :all: "bandit[sarif]==1.8.3" "pip-audit==2.10.1"

    - name: Run Bandit security linter
      id: bandit
      run: |
        # Upload all findings; medium/high severity findings block the job.
        bandit_status=0
        bandit -c pyproject.toml -r . -x .git,.github,__pycache__,.pytest_cache,.ruff_cache,tmp_venv,logs,images,services,service \
          -f sarif -o "$RUNNER_TEMP/bandit-results.sarif" --exit-zero || bandit_status=$?

        # Never replace a failed scan with an empty report.
        if [ -s "$RUNNER_TEMP/bandit-results.sarif" ]; then
          echo "sarif_ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Bandit did not produce a SARIF report (exit $bandit_status)."
          exit 1
        fi
        if [ "$bandit_status" -ne 0 ]; then
          exit "$bandit_status"
        fi
        bandit -c pyproject.toml -r . -x .git,.github,__pycache__,.pytest_cache,.ruff_cache,tmp_venv,logs,images,services,service \
          --severity-level medium

    - name: Upload Bandit results
      if: always() && steps.bandit.outputs.sarif_ready == 'true'
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: ${{ runner.temp }}/bandit-results.sarif
        category: python-bandit

    - name: Audit project dependencies
      run: pip-audit . --progress-spinner off

    - name: Audit deployment dependencies
      if: success() || failure()
      run: pip-audit -r requirements.txt --progress-spinner off
