name: Python Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 7 * * 2'
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  python-security:
    name: Python Security
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.13'

      - name: Install security tools
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-bandit.txt

      - name: Scan all Python sources and enforce every Bandit finding
        id: scan
        run: python3 scripts/run_bandit.py

      - name: Upload Bandit results
        if: always() && hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bandit-results.sarif
          category: python-bandit
    timeout-minutes: 30
