name: Python Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 2'  # Weekly on Tuesdays

jobs:
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        pip install bandit

    - name: Run Bandit security linter
      run: |
        bandit -r . -f sarif -o /tmp/bandit-results.sarif; EXIT_CODE=$?

        # Bandit may not create file on no findings — write empty SARIF
        if [ ! -f /tmp/bandit-results.sarif ]; then
          printf '%s\n' \
            '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Bandit","version":"1.0.0","informationUri":"https://bandit.readthedocs.io/","rules":[]}},"results":[]}]}' \
            > /tmp/bandit-results.sarif
        fi

        exit $EXIT_CODE

    - name: Upload Bandit results
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: /tmp/bandit-results.sarif
        category: python-bandit

    - name: Run Safety dependency check
      run: |
        pip freeze > requirements.txt
        safety check --json -o safety-results.json --file requirements.txt || true

    - name: Comment PR on Safety issues
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ Safety found Python dependency vulnerabilities!'
          })