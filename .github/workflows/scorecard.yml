name: Scorecard security audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 2 * * 3'  # Weekly on Wednesdays at 2:30 AM UTC

permissions:
  contents: read
  # Needed to upload the results to code-scanning dashboard.
  security-events: write
  # Needed for GitHub OIDC token
  id-token: write
  # Needed for checkout and scorecard action
  sources: read

jobs:
  scorecard:
    name: Scorecard
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/scorecard.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
    with:
      working-directory: .
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}