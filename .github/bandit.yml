# Pytest assertions verify behavior, rather than enforcing runtime safeguards.
# All other rules still scan tests; production assertions are still reported.
exclude_dirs:
  - './.git/'
  - './.venv/'
  - './.venv-ci/'
  - './build/'
  - './dist/'
  - './release-dist/'
assert_used:
  skips:
    - './tests/test_*.py'
    - './tests/contract/test_*.py'
    - './.github/release-tests/test_*.py'
