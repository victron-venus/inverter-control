[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inverter-control"
version = "0.1.0"
description = "Grid-zero feed-in control for Victron system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0"]

[tool.pylint.messages_control]
disable = [
    "E0401",  # Unable to import (system libs not in venv)
    "C0103",  # Invalid name (legacy naming conventions)
    "C0301",  # Line too long
    "W1203",  # f-string logging (style preference)
    "R0902",  # Too many instance attributes
    "R0903",  # Too few public methods
    "R0914",  # Too many local variables
    "R0915",  # Too many statements
    "C0116",  # Missing function docstring
    "C0413",  # Wrong import position
    "W0718",  # Catching general Exception
    "W0613",  # Unused argument
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inverter_control*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E722",  # Do not use bare except
    "F841",  # Local variable assigned but never used
]
