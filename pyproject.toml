[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inverter-control"
version = "1.18.8"
description = "Grid-zero feed-in control for Victron system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
]
test = []

[tool.pylint.messages_control]
disable = [
    "E0401",  # Unable to import (system libs not in venv)
    "C0103",  # Invalid name (legacy naming conventions)
    "C0301",  # Line too long
    "W1203",  # f-string logging (style preference)
    "R0902",  # Too many instance attributes
    "R0903",  # Too few public methods
    "R0912",  # Too many branches (complex calculation methods)
    "R0914",  # Too many local variables
    "R0915",  # Too many statements
    "C0116",  # Missing function docstring
    "C0413",  # Wrong import position
    "W0718",  # Catching general Exception
    "W0613",  # Unused argument
    "W0602",  # Global var not assigned (console_server module pattern)
    "W0603",  # Using global statement (console_server module pattern)
    "W1510",  # subprocess.run without check (keepalive existing pattern)
    "R0913",  # Too many arguments (main.py existing constructor)
    "C0415",  # Import outside toplevel (main.py existing pattern)
    "W0212",  # Protected member access (test files)
    "R0801",  # Similar lines/duplication (test file data fixtures)
    "R0904",  # Too many public methods (test_victron.py)
    "W0612",  # Unused variable (test files)
    "W0201",  # Attribute defined outside __init__ (test files)
    "C1803",  # Use implicit booleaness (test files)
    "C0115",  # Missing class docstring (test files)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inverter_control*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E722",  # Do not use bare except
    "F841",  # Local variable assigned but never used
    "BLE001",  # Do not catch blind exception (hardware control needs broad exception handling)
    "S110",    # try-except-pass (deliberate in watchdog/failsafe paths)
    "EXE001",  # Shebang in non-executable (module files not scripts)
    "PLW0602", # Global with no assignment (console_server module state pattern)
    "LOG015",  # exception() on root logger (existing pattern)
    "PLW1510", # subprocess.run without check=False (existing pattern)
    "N999",    # Invalid module name with hyphen (log-forwarder.py exists)
    "TRY401",  # Redundant exception in logging.exception (existing pattern)
    "SIM117",  # Nested with statements (test files, micro-optimization)
    "RUF015",  # next(iter()) vs slice (test readability)
    "PERF402",  # list.append vs list comprehension (test readability)
]