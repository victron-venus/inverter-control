sonar.organization=victron-venus
sonar.projectKey=victron-venus_inverter-control
sonar.sources=.
# Reviewed python:S8707 false positives in the frozen shared release helpers.
# prepare_version.py writes validated version text as content to fixed pr-body.md;
# release_versioned.py writes manifest content to a fixed private stage destination.
# Neither content value selects the output path. Automatic Analysis supports exact
# file exclusions here, so retain analysis of the other release helpers.
sonar.exclusions=**/test_*.py,**/tests/**,logs/**,.venv/**,scripts/prepare_version.py,scripts/release_versioned.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Exclude HTTP security hotspot (local HA instance)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=homeassistant.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=config.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=secrets.example.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e4.resourceKey=inverter_control/log_forwarder.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S5332
