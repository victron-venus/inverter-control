sonar.organization=victron-venus
sonar.projectKey=victron-venus_inverter-control
sonar.sources=.
sonar.exclusions=**/test_*.py,**/tests/**,logs/**,.venv/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Exclude HTTP security hotspot (local HA instance)
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=homeassistant.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=config.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=secrets.example.py
